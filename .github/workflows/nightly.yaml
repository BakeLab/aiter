name: Nightly Build

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Docker image for build'
        type: string
        required: false
      python_version:
        description: 'Python version (default: 3.14)'
        type: string
        required: false
      gpu_archs:
        description: 'GPU architectures (default: gfx942;gfx950)'
        type: string
        required: false
      skip_tests:
        description: 'Skip test job for faster iteration'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/aiter-release.yaml
    with:
      release_type: ${{ github.event_name == 'schedule' && 'nightlies' || github.event_name == 'pull_request' && 'nightlies' || 'devreleases' }}
      docker_image_py314: ${{ github.event.inputs.docker_image || 'rocm/pytorch:rocm7.14_ubuntu26.04_py3.14_pytorch_release_2.12.0' }}
      build_py314: ${{ github.event.inputs.python_version == '' || github.event.inputs.python_version == '3.14' }}
      gpu_archs: ${{ github.event.inputs.gpu_archs || 'gfx942;gfx950' }}
      runner: '["self-hosted", "linux", "x64", "cpu", "on-demand"]'
      add_date_stamp: true
    permissions:
      contents: read
      actions: read

  test:
    needs: build
    if: ${{ !(github.event.inputs.skip_tests || false) }}
    uses: ./.github/workflows/test-whl.yaml
    with:
      release_type: ${{ github.event_name == 'schedule' && 'nightlies' || github.event_name == 'pull_request' && 'nightlies' || 'devreleases' }}
      wheel_names: ${{ needs.build.outputs.wheel_names }}
    permissions:
      contents: read
      actions: read
